name: verify

on:
  push:
  pull_request:

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

jobs:
  solutions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Fetch the pinned Spring Boot jars
        run: java server/LabServer.java fetch-spring

      - name: Every reference solution passes its tests (all languages)
        run: |
          set -e
          for id in $(jq -r '.[].id' projects/catalog.json); do
            for lang in java python go cpp spring; do
              [ -d "projects/$id/$lang/starter/src" ] || continue
              echo "::group::$id ($lang solution)"
              java server/LabServer.java test "$id" solution "$lang"
              echo "::endgroup::"
            done
          done

      - name: Every starter compiles (tests are expected to fail)
        run: |
          for id in $(jq -r '.[].id' projects/catalog.json); do
            for lang in java python go cpp spring; do
              [ -d "projects/$id/$lang/starter/src" ] || continue
              out=$(java server/LabServer.java test "$id" starter "$lang" || true)
              if echo "$out" | grep -q "COMPILATION FAILED"; then
                echo "$out"; echo "::error::$lang starter for $id does not compile"; exit 1
              fi
              echo "$id ($lang): $(echo "$out" | tail -n 1)"
            done
          done

  docker:
    # x86-64 (Render) and arm64 (Oracle Ampere): each architecture has its own seccomp syscall table
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    name: docker (${{ matrix.runner }})
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t build-lab .
      - name: Start hosted mode
        run: |
          docker run -d --name lab -p 8080:8080 build-lab
          for i in $(seq 1 60); do curl -sf localhost:8080/api/config && break; sleep 2; done
          curl -sf localhost:8080/api/config | tee config.json
          for lang in java python go cpp; do grep -q "\"$lang\"" config.json || { echo "::error::$lang missing"; exit 1; }; done
      - name: Solutions pass inside the sandbox
        run: |
          for lang in java python go cpp; do
            curl -sf -X POST "localhost:8080/api/run/rate-limiter?mode=solution&lang=$lang" > "result-$lang.json"
            echo "$lang: $(jq -c '{ok, passed, total, timing}' "result-$lang.json")"
            jq -e '.ok == true' "result-$lang.json" > /dev/null || { cat "result-$lang.json"; exit 1; }
          done
      - name: Spring Boot solution passes inside the sandbox
        run: |
          curl -sf -X POST "localhost:8080/api/run/notes-api?mode=solution&lang=spring" > result-spring.json
          echo "spring: $(jq -c '{ok, passed, total, timing}' result-spring.json)"
          jq -r '.output' result-spring.json | grep "Run stats" || true
          jq -e '.ok == true' result-spring.json > /dev/null || { cat result-spring.json; exit 1; }
      - name: Spring Boot rejects submitted code until it has an OS-level sandbox
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "localhost:8080/api/run/notes-api?lang=spring"             -H 'Content-Type: application/json' --data-binary '{"notes/X.java":"package notes; class X {}"}')
          [ "$code" = "403" ] || { echo "::error::expected 403, got $code"; exit 1; }
      - name: JVM seccomp agent blocks trusted code too
        run: |
          out=$(docker run --rm --entrypoint sh -e LAB_SANDBOX=1 -v "$PWD/.github/sandbox-probes:/probes:ro" build-lab -c 'java -agentpath:$LAB_JVM_SANDBOX /probes/JvmProbe.java' 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "PROBE ALLOWED\|PROBE BROKEN" && { echo "::error::JVM agent gap"; exit 1; }
          [ "$(echo "$out" | grep -c 'PROBE BLOCKED')" -ge 3 ] || { echo "::error::JVM probes did not all run"; exit 1; }
          echo "$out" | grep -q "PROBE OK" || { echo "::error::JVM agent broke normal work"; exit 1; }
      - name: Submitted Spring code is contained (opt-in server)
        run: |
          docker run -d --name lab-spring -e LAB_SPRING_USER_CODE=1 -p 8082:8080 build-lab
          for i in $(seq 1 60); do curl -sf localhost:8082/api/config > /dev/null && break; sleep 2; done
          S=projects/notes-api/spring/starter/src
          files='{}'
          for f in $(cd "$S" && find . -type f | sed 's|^\./||'); do
            files=$(jq --arg k "$f" --rawfile v "$S/$f" '. + {($k): $v}' <<< "$files")
          done
          files=$(jq --rawfile v .github/sandbox-probes/SpringProbe.java '. + {"notes/SpringProbe.java": $v}' <<< "$files")
          echo "$files" > spring-probe.json
          out=$(curl -sf -X POST "localhost:8082/api/run/notes-api?lang=spring" -H 'Content-Type: application/json'             --data-binary @spring-probe.json | jq -r '.output')
          echo "$out" | grep "PROBE\|Run stats" || echo "$out" | head -n 40
          echo "$out" | grep -q "PROBE ALLOWED\|PROBE BROKEN" && { echo "::error::sandbox gap in spring"; exit 1; }
          [ "$(echo "$out" | grep -c 'PROBE BLOCKED')" -ge 5 ] || { echo "::error::spring probes did not all run"; exit 1; }
          echo "$out" | grep -q "PROBE OK" || { echo "::error::spring could not use its own temp dir"; exit 1; }
      - name: Spring Boot under Render's free-tier limits (512 MB, 0.1 CPU)
        run: |
          docker run -d --name lab-small --memory=512m --memory-swap=512m --cpus=0.1 -p 8081:8080 build-lab
          for i in $(seq 1 120); do curl -sf localhost:8081/api/config > /dev/null && break; sleep 2; done
          for run in 1 2 3; do
            start=$(date +%s)
            curl -s -m 170 -X POST "localhost:8081/api/run/notes-api?mode=solution&lang=spring" > "small-$run.json" || true
            echo "run $run: $(( $(date +%s) - start )) s wall, $(jq -c '{ok, passed, total, timing}' "small-$run.json" 2>/dev/null || head -c 300 "small-$run.json")"
            jq -r '.output' "small-$run.json" 2>/dev/null | grep "Run stats" || true
          done
          docker stats --no-stream lab-small
          docker inspect lab-small --format 'OOM killed: {{.State.OOMKilled}}, restarts: {{.RestartCount}}'
          docker logs lab-small 2>&1 | tail -n 20
      - name: Metrics count the runs
        run: |
          curl -sf localhost:8080/metrics > metrics.txt
          for lang in java python go cpp; do
            grep -q "^lab_runs_total{lang=\"$lang\",outcome=\"pass\"} 1$" metrics.txt || { cat metrics.txt; echo "::error::no pass metric for $lang"; exit 1; }
          done
          grep -c '"event":"run"' <(docker logs lab 2>&1)
      - name: Sandbox blocks forbidden operations
        run: bash .github/scripts/sandbox-probes.sh http://localhost:8080
      - name: Server log
        if: always()
        run: docker logs lab

  fleet:
    # Phase 2 setup on an arm64 machine like Oracle's: API -> Redis queue -> worker -> gVisor container per run
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install gVisor
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list > /dev/null
          sudo apt-get update && sudo apt-get install -y runsc
          sudo runsc install && sudo systemctl restart docker
      - name: Build image
        run: docker build -t build-lab .
      - name: Start Redis, the API and a worker
        run: |
          docker network create lab
          docker run -d --name redis --network lab -p 127.0.0.1:6379:6379 redis:7-alpine redis-server --requirepass ci-pass
          docker run -d --name api --network lab -p 8080:8080 -e LAB_ROLE=api -e LAB_REDIS_URL=redis://:ci-pass@redis:6379 build-lab
          javac -d build/classes server/LabServer.java
          mkdir -p "$RUNNER_TEMP/jobs"
          LAB_ROLE=worker LAB_REDIS_URL=redis://:ci-pass@127.0.0.1:6379 LAB_WORKER_SLOTS=2 LAB_RUNNER=docker \
            LAB_DOCKER_RUNTIME=runsc LAB_JOB_DIR="$RUNNER_TEMP/jobs" nohup java -cp build/classes LabServer > worker.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/api/config && break; sleep 2; done
          for i in $(seq 1 30); do grep -q "slots, runner docker" worker.log && break; sleep 1; done
          cat worker.log
      - name: Solutions pass through the queue in gVisor
        run: |
          for lang in java python go cpp; do
            curl -sf -X POST "localhost:8080/api/run/rate-limiter?mode=solution&lang=$lang" > "result-$lang.json"
            echo "$lang: $(jq -c '{ok, passed, total, timing}' "result-$lang.json")"
            jq -e '.ok == true' "result-$lang.json" > /dev/null || { cat "result-$lang.json"; exit 1; }
          done
      - name: Runs really happen inside gVisor
        run: |
          # submitted code prints /proc/version: gVisor reports its own kernel, never the host's
          jq -n --rawfile init projects/rate-limiter/python/starter/src/ratelimiter/__init__.py \
                --rawfile lim projects/rate-limiter/python/starter/src/ratelimiter/limiters.py \
            '{"ratelimiter/__init__.py": ("print(\"KERNEL \" + open(\"/proc/version\").read())\n" + $init), "ratelimiter/limiters.py": $lim}' > probe.json
          out=$(curl -sf -X POST "localhost:8080/api/run/rate-limiter?lang=python" -H 'Content-Type: application/json' --data-binary @probe.json | jq -r '.output')
          echo "$out" | grep KERNEL
          host=$(cat /proc/version)
          echo "$out" | grep -qF "$host" && { echo "::error::run used the host kernel, not gVisor"; exit 1; } || echo "not the host kernel: OK"
      - name: Sandbox blocks forbidden operations
        run: bash .github/scripts/sandbox-probes.sh http://localhost:8080
      - name: Metrics show the fleet
        run: |
          curl -sf localhost:8080/metrics > metrics.txt
          grep -E "^lab_(queue_depth|workers_online|runs_total)" metrics.txt
          grep -q "^lab_workers_online 1$" metrics.txt || { echo "::error::worker not counted"; exit 1; }
      - name: Logs
        if: always()
        run: |
          docker logs api 2>&1 | tail -n 50
          tail -n 50 worker.log
