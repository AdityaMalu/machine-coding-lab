spring.application.name=orders
# an in-memory H2 database; LOCK_TIMEOUT gives queued row locks time to clear on a slow machine
spring.datasource.url=jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=20000
spring.jpa.hibernate.ddl-auto=create-drop
# no lazy loading outside transactions behind your back
spring.jpa.open-in-view=false
# lets the tests count SQL statements
spring.jpa.properties.hibernate.generate_statistics=true
